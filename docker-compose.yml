version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ftt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ftt_user
      POSTGRES_PASSWORD: ftt_password
      POSTGRES_DB: future_travel_tours
    ports:
      - "5432:5432"
    volumes:
      - ftt_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ftt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  ftt_postgres_data:
